name: Engineering readiness FastAPI, Langfuse SDK, Docker
on:
  push:
    paths:
      - 'extensions/llm-engineering-readiness/**'
      - '.github/workflows/llm-engineering-readiness.yml'
  workflow_dispatch:
jobs:
  unit-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/llm-engineering-readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FastAPI and Langfuse SDK v4
        run: python -m pip install -r requirements.txt
      - name: Unit/API and optional Langfuse interface tests
        run: python -m pytest -q tests/
      - name: Static preflight and GPU demo syntax
        run: python -m compileall -q gpu agent
      - name: Build Docker image
        run: docker build -t risk-api-ci .
      - name: Start and smoke-test real container
        run: |
          docker run -d --name risk-ci --publish 127.0.0.1:19876:8000 risk-api-ci
          trap 'docker rm -f risk-ci || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:19876/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19876/health | grep -q 'ok'
          curl -fsS -H 'Content-Type: application/json' -d '{"question":"supplier outage","topic":"supplier_outage_minutes","value":131,"as_of":"2026-10-12"}' http://127.0.0.1:19876/v1/review | grep -q 'SUP-01@v2'
