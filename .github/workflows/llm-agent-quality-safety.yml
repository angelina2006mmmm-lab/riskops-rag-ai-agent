name: LLM agent evaluation and real multi-tool LangGraph
on:
  push:
    paths:
      - 'extensions/llm-research-lab/quality_safety/**'
      - '.github/workflows/llm-agent-quality-safety.yml'
  pull_request:
    paths:
      - 'extensions/llm-research-lab/quality_safety/**'
  workflow_dispatch:
jobs:
  verify-quality-and-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/llm-research-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'langgraph>=0.6,<2'
      - run: python -m pytest -q quality_safety/tests/
      - run: python -m quality_safety.quality
      - run: python -m quality_safety.multi_tool_graph
