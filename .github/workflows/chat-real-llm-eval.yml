name: Real LLM chat prompt benchmark (CPU)
on:
  push:
    paths:
      - 'extensions/chat-ai-analytics/src/real_llm_eval.py'
      - '.github/workflows/chat-real-llm-eval.yml'
  workflow_dispatch:
jobs:
  real-pretrained-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: extensions/chat-ai-analytics
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Transformers
        run: python -m pip install 'transformers>=4.48,<4.58' 'accelerate>=1,<2'
      - name: Run actual Qwen 0.5B inference across two prompts and same 10 labelled examples
        run: python -m src.real_llm_eval
      - name: Replay real model outputs through LangGraph specialist routing
        run: |
          python -m pip install 'langgraph>=0.6,<2'
          python -m src.agent_eval
      - uses: actions/upload-artifact@v4
        with:
          name: real-llm-chat-prompt-and-agent-metrics
          path: |
            extensions/chat-ai-analytics/reports/real_llm_prompt_eval.json
            extensions/chat-ai-analytics/reports/multi_agent_quality.json
