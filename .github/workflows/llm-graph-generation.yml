name: LangGraph graph RAG with real pretrained generation
on:
  push:
    paths:
      - 'extensions/llm-research-lab/research_lab/graph_rag_llm.py'
      - 'extensions/llm-research-lab/tests/test_real_graph_rag_llm.py'
      - '.github/workflows/llm-graph-generation.yml'
  workflow_dispatch:
jobs:
  graph-rag-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: extensions/llm-research-lab
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "45"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graph and real-LM dependencies
        run: python -m pip install 'torch>=2.3,<3' 'transformers>=4.48,<5' 'langgraph>=0.6,<2' 'pytest>=8,<10'
      - name: Run generation and cited retrieval
        run: python -m research_lab.graph_rag_llm
      - name: Verify grounded and abstaining routes
        run: python -m pytest -q tests/test_real_graph_rag_llm.py
