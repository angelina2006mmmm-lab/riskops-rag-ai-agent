name: Pretrained-model PEFT SFT and grouped rewards
on:
  push:
    paths:
      - 'extensions/llm-research-lab/research_lab/pretrained_*.py'
      - '.github/workflows/llm-pretrained-research.yml'
  workflow_dispatch:
jobs:
  pretrained-peft-and-grouped-reward:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extensions/llm-research-lab
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "45"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small pretrained-model experiment dependencies
        run: python -m pip install 'torch>=2.3,<3' 'transformers>=4.48,<5' 'peft>=0.15,<0.20' 'accelerate>=1,<2'
      - name: Run actual PEFT LoRA SFT
        run: python -m research_lab.pretrained_peft_sft --steps 65
      - name: Run grouped relative rewards on pretrained LM
        run: python -m research_lab.pretrained_group_reward --steps 65
      - name: Publish measured results in workflow summary
        run: |
          echo '### Pretrained TinyStories-1M — experimental results' >> "$GITHUB_STEP_SUMMARY"
          echo '#### PEFT LoRA SFT' >> "$GITHUB_STEP_SUMMARY"
          cat reports/pretrained_peft_sft.json >> "$GITHUB_STEP_SUMMARY"
          echo '#### Grouped reward policy optimization (constrained next token)' >> "$GITHUB_STEP_SUMMARY"
          cat reports/pretrained_group_reward.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: TinyStories-1M-peft-and-grouped-rewards
          path: |
            extensions/llm-research-lab/reports/pretrained_peft_sft.json
            extensions/llm-research-lab/reports/pretrained_group_reward.json
            extensions/llm-research-lab/artifacts/lora_adapter/**

