name: Verified LangGraph integration
on:
  push:
    paths:
      - 'extensions/llm-research-lab/**'
      - '.github/workflows/llm-real-llm-checks.yml'
  workflow_dispatch:
jobs:
  langgraph-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/llm-research-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified graph dependencies
        run: python -m pip install 'langgraph>=0.6,<2' 'pytest>=8,<10'
      - name: Execute actual LangGraph graph
        run: python -m research_lab.agentic_graph_rag
      - name: Run integration tests
        run: python -m pytest -q tests/test_real_langgraph.py tests/test_graph_and_algorithms.py
