name: GRPO-style pretrained policy research v2
on:
  push:
    paths:
      - 'extensions/llm-research-lab/research_lab/pretrained_group_reward_v2.py'
      - '.github/workflows/llm-group-reward-v2.yml'
  workflow_dispatch:
jobs:
  grouped-reward-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extensions/llm-research-lab
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "45"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.3,<3' 'transformers>=4.48,<5' 'peft>=0.15,<0.20' 'accelerate>=1,<2'
      - run: python -m research_lab.pretrained_group_reward_v2 --steps 120
      - uses: actions/upload-artifact@v4
        with:
          name: grouped-reward-v2-metrics
          path: extensions/llm-research-lab/reports/pretrained_group_reward_v2.json
