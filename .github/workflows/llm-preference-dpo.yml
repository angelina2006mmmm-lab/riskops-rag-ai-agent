name: Tiny pretrained-model DPO research
on:
  push:
    paths:
      - 'extensions/llm-research-lab/research_lab/pretrained_preference_dpo.py'
      - '.github/workflows/llm-preference-dpo.yml'
  workflow_dispatch:
jobs:
  tiny-pretrained-dpo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/llm-research-lab
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '45'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.3,<3' 'transformers>=4.48,<5' 'peft>=0.15,<0.20' 'accelerate>=1,<2'
      - name: DPO actual reference + trainable LoRA adapter
        run: python -m research_lab.pretrained_preference_dpo --steps 32
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-pretrained-dpo-metrics
          path: extensions/llm-research-lab/reports/pretrained_preference_dpo.json
