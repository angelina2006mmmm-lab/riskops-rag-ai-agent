name: Real TRL GRPO smoke experiment
on:
  push:
    paths:
      - 'extensions/llm-engineering-readiness/grpo/**'
      - '.github/workflows/trl-grpo-smoke.yml'
  workflow_dispatch:
jobs:
  cpu-grpo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extensions/llm-engineering-readiness
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin TRL and model dependencies
        run: python -m pip install 'torch>=2.3,<3' 'transformers>=4.55,<5' 'trl==0.24.0' 'datasets>=3,<5' 'accelerate>=1,<2'
      - name: Actual GRPO training on pretrained tiny LM
        run: GRPO_STEPS=4 python -m grpo.train
      - uses: actions/upload-artifact@v4
        with:
          name: trl-grpo-cpu-smoke
          path: extensions/llm-engineering-readiness/reports/grpo_trl_smoke.json
