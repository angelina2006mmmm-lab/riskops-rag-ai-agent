name: Chat AI Analytics Offline Evaluation
on:
  push:
    paths:
      - 'extensions/chat-ai-analytics/**'
      - '.github/workflows/chat-ai-analytics.yml'
  workflow_dispatch:
jobs:
  quality-and-sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/chat-ai-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install -r requirements.txt 'langgraph>=0.6,<2'
      - name: Run chat analytics, model-contract and LangGraph tests
        run: python -m pytest -q tests/
      - name: Generate offline evaluation and synthetic monitoring
        run: |
          python -m src.experiment
          python -m src.analytics
          python -m src.agent_eval
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-chat-offline-metrics
          path: extensions/chat-ai-analytics/reports/*.json
