name: LangGraph and LoRA risk agent
on:
  push:
    paths:
      - 'extensions/langgraph-lora-risk-agent/**'
      - '.github/workflows/langgraph-lora-ci.yml'
  pull_request:
    paths:
      - 'extensions/langgraph-lora-risk-agent/**'
      - '.github/workflows/langgraph-lora-ci.yml'
  workflow_dispatch:
jobs:
  graph-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/langgraph-lora-risk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_agent.py tests/test_eval.py
      - run: python -m scripts.evaluate
